<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — My Eco Ganesh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --cream: #F5EEDC;
      --forest: #1F3D2B;
      --forest-2: #163024;
      --marigold: #E3A83B;
      --clay-dark: #8C481E;
      --ink: #2B2118;
      --shadow: 0 12px 30px rgba(31,61,43,0.14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Work Sans', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      background: #fff;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(43,33,24,0.12);
    }
    .auth-card h2 {
      font-family: 'Fraunces', serif;
      color: var(--forest-2);
      margin: 0 0 8px;
      font-size: 1.8rem;
    }
    .auth-card p.sub {
      color: #6b5c48;
      margin: 0 0 24px;
      font-size: 14.5px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
      color: var(--forest-2);
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1.5px solid #dcd4c0;
      font-family: 'Work Sans', sans-serif;
      font-size: 14.5px;
      transition: border-color .2s;
    }
    input:focus {
      outline: none;
      border-color: var(--forest);
    }
    button {
      width: 100%;
      padding: 14px;
      border-radius: 999px;
      border: none;
      background: var(--forest);
      color: var(--cream);
      font-family: 'Work Sans', sans-serif;
      font-weight: 600;
      font-size: 15.5px;
      cursor: pointer;
      transition: background .2s, transform .2s;
      margin-top: 10px;
    }
    button:hover {
      background: var(--forest-2);
      transform: translateY(-2px);
    }
    .msg-box {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13.5px;
      margin-bottom: 16px;
      display: none;
    }
    .msg-error { background: #fde8e8; color: #9b1c1c; }
    .msg-success { background: #def7ec; color: #03543f; }
    .footer-text {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #5a4c3b;
    }
    .footer-text a {
      color: var(--clay-dark);
      font-weight: 600;
      text-decoration: none;
    }
    .back-home {
      display: inline-block;
      margin-bottom: 16px;
      color: var(--forest);
      text-decoration: none;
      font-weight: 600;
      font-size: 13.5px;
    }
  </style>
</head>
<body>

<div class="auth-card">
  <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> ← Back to Home</a>
  <h2>Login Page</h2>
  <p class="sub">Welcome back! Log in to manage your Ganpati bookings.</p>

  <div id="msg" class="msg-box"></div>

  <form id="login-form">
    <div class="form-group">
      <label>Email Address / Username:</label>
      <input type="email" id="email" placeholder="enter your email" required>
    </div>

    <div class="form-group">
      <label>Password:</label>
      <input type="password" id="password" placeholder="••••••••" required>
    </div>

    <button type="submit">Login</button>
    <p class="footer-text">Don't have an account? <a href="signup.html">Signup</a></p>
  </form>
</div>

<script>
  const API_BASE = 'http://localhost:5000/api';

  document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const msgBox = document.getElementById('msg');
    msgBox.style.display = 'none';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      const res = await fetch(`${API_BASE}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (data.success) {
        msgBox.className = 'msg-box msg-success';
        msgBox.textContent = 'Login successful! Redirecting...';
        msgBox.style.display = 'block';

        localStorage.setItem('ganpati_token', data.token);
        localStorage.setItem('ganpati_user', JSON.stringify(data.user));

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1200);
      } else {
        msgBox.className = 'msg-box msg-error';
        msgBox.textContent = data.message || 'Login failed.';
        msgBox.style.display = 'block';
      }
    } catch (err) {
      msgBox.className = 'msg-box msg-error';
      msgBox.textContent = 'Could not connect to backend server. Make sure server is running at port 5000.';
      msgBox.style.display = 'block';
    }
  });
</script>

</body>
</html>
